<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navora Digital | Kartu Profil</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="assets/img/logo.png">
</head>

<body class="relative min-h-screen flex flex-col items-center justify-center px-4 py-12">

  <!-- Quick nav pill -->
  <nav aria-label="Navigasi profil" class="relative z-10 mb-5 flex items-center gap-2 glass-panel rounded-full px-4 py-1.5 text-xs text-white/90">
    <a href="index.html" class="hover:text-[var(--lime)] font-medium transition">Buat Kartu Sendiri</a>
    <span class="opacity-30" aria-hidden="true">|</span>
    <button id="btn-show-qr" type="button" class="hidden hover:text-[var(--lime)] font-mono font-700 transition">QR Code</button>
  </nav>

  <main class="relative z-10 w-full flex flex-col items-center">

  <!-- STATE: LOADING -->
  <div id="state-loading" class="relative z-10 flex flex-col items-center gap-3 text-white/80 my-16">
    <div class="w-9 h-9 rounded-full border-2 border-[var(--lime)] border-t-transparent animate-spin"></div>
    <p class="font-mono text-xs tracking-widest uppercase">Memuat profil…</p>
  </div>

  <!-- STATE: ERROR -->
  <div id="state-error" class="hidden relative z-10 w-full max-w-sm rise">
    <div class="badge rounded-[28px] p-8 pt-10 text-center">
      <p class="font-mono text-[10px] tracking-[0.25em] uppercase text-[var(--ink-soft)] mb-5">Kartu Profil Digital</p>
      <svg class="w-12 h-12 mx-auto mb-4" viewBox="0 0 100 100" fill="var(--purple)">
        <path d="M50 0 L58 38 L96 40 L62 58 L74 96 L50 72 L26 96 L38 58 L4 40 L42 38 Z"/>
      </svg>
      <h1 class="font-display font-700 text-3xl leading-[1.05]">Profil</h1>
      <h1 class="font-display font-700 text-3xl leading-[1.05] split-underline inline-block mb-4">tidak ditemukan.</h1>
      <p class="text-sm text-[var(--ink-soft)] leading-relaxed mt-3 mb-5">
        ID pada tautan ini tidak cocok dengan data manapun. Coba periksa lagi, contohnya
        <span class="font-mono text-[13px] text-[var(--ink)]">?id=xav</span>.
      </p>
      <a href="index.html" class="btn-lime inline-block rounded-xl px-5 py-2.5 text-xs font-700 font-display">
        Buat Kartu Profil Baru
      </a>
    </div>
  </div>

  <!-- STATE: CARD -->
  <div id="state-card" class="hidden relative z-10 w-full max-w-[340px] sm:max-w-sm rise lanyard-rig lanyard-rig--css">

    <!-- Tali & klip lanyard -->
    <div class="lanyard-strap" aria-hidden="true">
      <span>NAVORA</span>
      <span>DIGITAL</span>
    </div>
    <div class="lanyard-wrap">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="metalClipProf" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#F8FAFC"/>
            <stop offset="50%" stop-color="#CBD5E1"/>
            <stop offset="100%" stop-color="#64748B"/>
          </linearGradient>
        </defs>
        <rect x="13" y="0" width="38" height="12" rx="3" fill="#15130F"/>
        <circle cx="32" cy="6" r="2.8" fill="url(#metalClipProf)"/>
        <rect x="22" y="12" width="20" height="8" rx="4" fill="none" stroke="url(#metalClipProf)" stroke-width="3"/>
        <rect x="27" y="19" width="10" height="10" rx="2.5" fill="url(#metalClipProf)" stroke="#475569" stroke-width="1"/>
        <path d="M18 32 h28 a6 6 0 0 1 6 6 v10 a4 4 0 0 1 -4 4 h-32 a4 4 0 0 1 -4 -4 v-10 a6 6 0 0 1 6 -6 z" fill="url(#metalClipProf)" stroke="#64748B" stroke-width="1.5"/>
        <rect x="21" y="45" width="22" height="5" rx="2.5" fill="#475569"/>
      </svg>
    </div>

    <div class="badge rounded-[28px] overflow-hidden pt-9">

      <div class="px-7">
        <p class="font-mono text-[10px] tracking-[0.25em] uppercase text-[var(--ink-soft)] text-center mt-6 mb-4">
          Kartu Profil Digital
        </p>
        <h1 id="profile-name" class="font-display font-700 text-3xl leading-[1.05] text-center mb-5"></h1>
      </div>

      <div class="px-7 flex items-start gap-3">
        <div id="social-col" class="flex flex-col gap-2 pt-1">
          <a id="social-instagram" href="#" target="_blank" rel="noopener" class="hidden icon-chip" title="Instagram">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/>
            </svg>
          </a>
          <a id="social-tiktok" href="#" target="_blank" rel="noopener" class="hidden icon-chip" title="TikTok">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M14 3c.3 1.9 1.6 3.4 3.5 3.8v2.6a6.3 6.3 0 01-3.5-1.1v6.2a5.3 5.3 0 11-4.6-5.2v2.7a2.6 2.6 0 102.1 2.6V3h2.5z"/>
            </svg>
          </a>
          <a id="social-facebook" href="#" target="_blank" rel="noopener" class="hidden icon-chip" title="Facebook">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M13.5 21v-7.5H16l.4-3H13.5V8.4c0-.9.2-1.5 1.5-1.5h1.6V4.3C16.3 4.2 15.3 4 14.2 4c-2.4 0-4 1.5-4 4.1v2.4H7.8v3h2.4V21h3.3z"/>
            </svg>
          </a>
          <a id="social-youtube" href="#" target="_blank" rel="noopener" class="hidden icon-chip" title="YouTube">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M21.5 7.5s-.2-1.5-.8-2.1c-.8-.8-1.7-.8-2.1-.9C15.9 4.3 12 4.3 12 4.3h0s-3.9 0-6.6.2c-.4 0-1.3.1-2.1.9-.6.6-.8 2.1-.8 2.1S2.3 9.3 2.3 11v1.9c0 1.8.2 3.5.2 3.5s.2 1.5.8 2.1c.8.8 1.9.8 2.3.9 1.7.1 7.2.2 7.2.2s3.9 0 6.6-.2c.4-.1 1.3-.1 2.1-.9.6-.6.8-2.1.8-2.1s.2-1.8.2-3.5V11c0-1.8-.2-3.5-.2-3.5zM9.8 14.6V8.9l5.4 2.9-5.4 2.8z"/>
            </svg>
          </a>
          <a id="social-linkedin" href="#" target="_blank" rel="noopener" class="hidden icon-chip" title="LinkedIn">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6.9 8.4H4V20h2.9V8.4zM5.4 4a1.7 1.7 0 100 3.3 1.7 1.7 0 000-3.3zM20 13.4c0-3.1-1.7-4.6-4-4.6a3.4 3.4 0 00-3.1 1.7V8.4H10V20h2.9v-6.1c0-1.6.3-3.1 2.2-3.1s1.9 1.8 1.9 3.2V20H20v-6.6z"/>
            </svg>
          </a>
        </div>

        <div class="flex-1 aspect-square rounded-2xl overflow-hidden" style="background:var(--lime);">
          <img id="profile-photo" src="" alt="" class="w-full h-full object-cover object-center">
        </div>
      </div>

      <div class="px-7 pt-4 text-center">
        <p id="profile-jabatan" class="hidden inline-block font-700 text-sm split-underline px-0.5"></p>
      </div>

      <div class="px-7 pt-5 pb-3 flex items-center gap-2">
        <a id="link-email" href="#" class="btn-email flex-1 flex items-center justify-center gap-1.5 rounded-lg px-2 py-2">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9 6 9-6M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z"/>
          </svg>
          <span id="text-email" class="text-xs font-500 truncate"></span>
        </a>
        <a id="link-whatsapp" href="#" target="_blank" rel="noopener" class="btn-whatsapp flex-1 flex items-center justify-center gap-1.5 rounded-lg px-2 py-2 text-xs font-700 whitespace-nowrap">
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a10 10 0 00-8.5 15.2L2 22l4.9-1.5A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .9.9-2.9-.2-.3A8 8 0 1112 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1s-.6.8-.7.9-.3.2-.5.1a6.6 6.6 0 01-1.9-1.2 7.2 7.2 0 01-1.3-1.7c-.1-.2 0-.4.1-.5l.4-.4c.1-.1.2-.3.2-.4a.5.5 0 000-.5c-.1-.1-.5-1.3-.7-1.8-.2-.4-.4-.4-.5-.4h-.5a.9.9 0 00-.7.3 2.8 2.8 0 00-.9 2.1 4.9 4.9 0 001 2.5 11.1 11.1 0 004.6 4c.6.3 1.1.4 1.5.6.6.2 1.2.1 1.6.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1s-.2-.2-.4-.3z"/>
          </svg>
          WhatsApp
        </a>
      </div>

      <div class="px-7 pb-5 flex items-center gap-2">
        <button id="btn-save-vcard" type="button" class="w-full rounded-lg py-2 text-[11px] font-mono font-700 bg-black/5 hover:bg-[var(--lime)] border border-black/15 transition">
          + Simpan Kontak (.vcf)
        </button>
      </div>

      <div class="ticket-edge mx-7"></div>
      <div class="px-7 py-4 flex items-center justify-between">
        <div class="barcode flex items-end h-6" aria-hidden="true">
          <span style="height:100%"></span><span style="height:55%"></span><span style="height:80%"></span>
          <span style="height:40%"></span><span style="height:100%"></span><span style="height:65%"></span>
          <span style="height:50%"></span><span style="height:90%"></span><span style="height:60%"></span>
          <span style="height:100%"></span><span style="height:45%"></span><span style="height:75%"></span>
        </div>
        <p id="id-badge" class="font-mono text-[10px] tracking-[0.15em] text-[var(--ink-soft)] uppercase text-right leading-tight"></p>
      </div>
    </div>
  </div>
  </main>

  <!-- MODAL QR CODE -->
  <div id="qr-modal" role="dialog" aria-modal="true" aria-labelledby="qr-modal-title" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="cream-card rounded-[28px] p-6 max-w-xs w-full text-center rise">
      <div class="flex items-center justify-between mb-4">
        <span id="qr-modal-title" class="font-mono text-xs font-700 uppercase text-[var(--ink-soft)]">Scan QR Profil</span>
        <button id="btn-close-qr" type="button" aria-label="Tutup modal QR" class="w-8 h-8 rounded-full bg-black/10 hover:bg-black/20 font-bold text-sm">×</button>
      </div>
      <div id="profile-qr-box" class="inline-block bg-white p-3 rounded-2xl border-2 border-[var(--ink)] mb-3"></div>
      <p id="qr-modal-name" class="font-display font-700 text-lg"></p>
      <p id="qr-modal-id" class="font-mono text-xs text-[var(--ink-soft)] mb-4"></p>
      <button id="btn-dl-profile-qr" type="button" class="btn-lime w-full rounded-xl py-2.5 text-xs font-700 font-display">
        Download QR Code
      </button>
    </div>
  </div>

  <script type="module" src="js/pages/profile.js"></script>
</body>
</html>
