<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navora Digital</title>

<!-- Tailwind CSS via CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Google Fonts: Space Grotesk (headline tebal), Inter (body), JetBrains Mono (label kecil) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Styling khusus halaman ini -->
<link rel="stylesheet" href="style.css">
</head>

<body class="relative min-h-screen flex items-center justify-center px-4 py-14">

  <!-- Lapisan dekoratif -->
  <div class="deco">
    <p class="ghost-text text-[9rem] -top-6 -left-6 rotate-[-6deg]">ID</p>
    <p class="ghost-text text-[7rem] bottom-4 right-[-1.5rem] rotate-[4deg]">DIGITAL</p>
    <div class="dotgrid top-8 left-8"></div>
    <div class="dotgrid bottom-10 right-6"></div>

    <svg class="squiggle" width="260" height="120" style="top:38%; right:-40px;" viewBox="0 0 260 120" fill="none">
      <path d="M2 60 C40 10, 70 110, 110 60 S180 10, 220 60 S258 100 258 100" stroke="#D6FA3B" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <svg class="star" width="90" height="90" style="top:14%; left:6%;" viewBox="0 0 100 100" fill="#D6FA3B">
      <path d="M50 0 L58 38 L96 40 L62 58 L74 96 L50 72 L26 96 L38 58 L4 40 L42 38 Z"/>
    </svg>
    <svg class="star" width="46" height="46" style="bottom:8%; left:14%; opacity:.7;" viewBox="0 0 100 100" fill="#D6FA3B">
      <path d="M50 0 L58 38 L96 40 L62 58 L74 96 L50 72 L26 96 L38 58 L4 40 L42 38 Z"/>
    </svg>
  </div>

  <!-- STATE: LOADING -->
  <div id="state-loading" class="relative z-10 flex flex-col items-center gap-3 text-white/80">
    <div class="w-9 h-9 rounded-full border-2 border-[var(--lime)] border-t-transparent animate-spin"></div>
    <p class="font-mono text-xs tracking-widest uppercase">Memuat profil…</p>
  </div>

  <!-- STATE: ERROR -->
  <div id="state-error" class="hidden relative z-10 w-full max-w-sm rise">
    <div class="badge rounded-[28px] p-8 pt-10 text-center">
      <p class="font-mono text-[10px] tracking-[0.25em] uppercase text-[var(--ink-soft)] mb-5">Kartu Profil Digital</p>
      <svg class="w-12 h-12 mx-auto mb-4" viewBox="0 0 100 100" fill="var(--purple)">
        <path d="M50 0 L58 38 L96 40 L62 58 L74 96 L50 72 L26 96 L38 58 L4 40 L42 38 Z"/>
      </svg>
      <h1 class="font-display font-700 text-3xl leading-[1.05]">Profil</h1>
      <h1 class="font-display font-700 text-3xl leading-[1.05] split-underline inline-block mb-4">tidak ditemukan.</h1>
      <p class="text-sm text-[var(--ink-soft)] leading-relaxed mt-3">
        ID pada tautan ini tidak cocok dengan data manapun. Coba periksa lagi, contohnya
        <span class="font-mono text-[13px] text-[var(--ink)]">?id=budi</span>.
      </p>
    </div>
  </div>

  <!-- STATE: CARD -->
  <div id="state-card" class="hidden relative z-10 w-full max-w-sm rise">

    <!-- Lanyard clip -->
    <div class="lanyard-wrap">
      <svg width="86" height="150" viewBox="0 0 86 150" fill="none">
        <rect x="30" y="0" width="26" height="70" rx="6" fill="var(--lime)"/>
        <circle cx="43" cy="14" r="4.5" fill="var(--purple-deep)"/>
        <circle cx="43" cy="72" r="9" fill="#D9D9D9" stroke="#9A9A9A" stroke-width="2"/>
        <path d="M43 81 L43 100" stroke="#B9B9B9" stroke-width="5" stroke-linecap="round"/>
        <path d="M25 100 h36 a10 10 0 0 1 10 10 v6 a10 10 0 0 1 -10 10 h-8 l-10 14 l-10 -14 h-8 a10 10 0 0 1 -10 -10 v-6 a10 10 0 0 1 10 -10 z"
              fill="#E6E6E6" stroke="#A6A6A6" stroke-width="2"/>
      </svg>
    </div>

    <div class="badge rounded-[28px] overflow-hidden pt-9">

      <div class="px-7">
<p class="font-mono text-[10px] tracking-[0.25em] uppercase text-[var(--ink-soft)] text-center mt-6 mb-4">          Kartu Profil Digital
        </p>
        <h1 id="profile-name" class="font-display font-700 text-3xl leading-[1.05] text-center mb-5"></h1>
      </div>

      <div class="px-7 flex items-start gap-3">
        <div id="social-col" class="flex flex-col gap-2 pt-1">
          <a id="social-instagram" href="#" target="_blank" rel="noopener" class="hidden icon-chip">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/>
            </svg>
          </a>
          <a id="social-tiktok" href="#" target="_blank" rel="noopener" class="hidden icon-chip">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M14 3c.3 1.9 1.6 3.4 3.5 3.8v2.6a6.3 6.3 0 01-3.5-1.1v6.2a5.3 5.3 0 11-4.6-5.2v2.7a2.6 2.6 0 102.1 2.6V3h2.5z"/>
            </svg>
          </a>
          <a id="social-facebook" href="#" target="_blank" rel="noopener" class="hidden icon-chip">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M13.5 21v-7.5H16l.4-3H13.5V8.4c0-.9.2-1.5 1.5-1.5h1.6V4.3C16.3 4.2 15.3 4 14.2 4c-2.4 0-4 1.5-4 4.1v2.4H7.8v3h2.4V21h3.3z"/>
            </svg>
          </a>
          <a id="social-youtube" href="#" target="_blank" rel="noopener" class="hidden icon-chip">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M21.5 7.5s-.2-1.5-.8-2.1c-.8-.8-1.7-.8-2.1-.9C15.9 4.3 12 4.3 12 4.3h0s-3.9 0-6.6.2c-.4 0-1.3.1-2.1.9-.6.6-.8 2.1-.8 2.1S2.3 9.3 2.3 11v1.9c0 1.8.2 3.5.2 3.5s.2 1.5.8 2.1c.8.8 1.9.8 2.3.9 1.7.1 7.2.2 7.2.2s3.9 0 6.6-.2c.4-.1 1.3-.1 2.1-.9.6-.6.8-2.1.8-2.1s.2-1.8.2-3.5V11c0-1.8-.2-3.5-.2-3.5zM9.8 14.6V8.9l5.4 2.9-5.4 2.8z"/>
            </svg>
          </a>
          <a id="social-linkedin" href="#" target="_blank" rel="noopener" class="hidden icon-chip">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6.9 8.4H4V20h2.9V8.4zM5.4 4a1.7 1.7 0 100 3.3 1.7 1.7 0 000-3.3zM20 13.4c0-3.1-1.7-4.6-4-4.6a3.4 3.4 0 00-3.1 1.7V8.4H10V20h2.9v-6.1c0-1.6.3-3.1 2.2-3.1s1.9 1.8 1.9 3.2V20H20v-6.6z"/>
            </svg>
          </a>
        </div>

        <div class="flex-1 aspect-square rounded-2xl overflow-hidden" style="background:var(--lime);">
          <img id="profile-photo" src="" alt="" class="w-full h-full object-cover object-center">
        </div>
      </div>

      <div class="px-7 pt-4 text-center">
        <p id="profile-jabatan" class="hidden inline-block font-700 text-sm split-underline px-0.5"></p>
      </div>

      <div class="px-7 pt-5 pb-6 flex items-center gap-2">
        <a id="link-email" href="#" class="btn-email flex-1 flex items-center justify-center gap-1.5 rounded-lg px-2 py-2">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9 6 9-6M4 5h16a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1z"/>
          </svg>
          <span id="text-email" class="text-xs font-500 truncate"></span>
        </a>
        <a id="link-whatsapp" href="#" target="_blank" rel="noopener" class="btn-whatsapp flex-1 flex items-center justify-center gap-1.5 rounded-lg px-2 py-2 text-xs font-700 whitespace-nowrap">
          <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a10 10 0 00-8.5 15.2L2 22l4.9-1.5A10 10 0 1012 2zm0 18a8 8 0 01-4.1-1.1l-.3-.2-3 .9.9-2.9-.2-.3A8 8 0 1112 20zm4.4-5.9c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1s-.6.8-.7.9-.3.2-.5.1a6.6 6.6 0 01-1.9-1.2 7.2 7.2 0 01-1.3-1.7c-.1-.2 0-.4.1-.5l.4-.4c.1-.1.2-.3.2-.4a.5.5 0 000-.5c-.1-.1-.5-1.3-.7-1.8-.2-.4-.4-.4-.5-.4h-.5a.9.9 0 00-.7.3 2.8 2.8 0 00-.9 2.1 4.9 4.9 0 001 2.5 11.1 11.1 0 004.6 4c.6.3 1.1.4 1.5.6.6.2 1.2.1 1.6.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1s-.2-.2-.4-.3z"/>
          </svg>
          WhatsApp
        </a>
      </div>

      <div class="ticket-edge mx-7"></div>
      <div class="px-7 py-4 flex items-center justify-between">
        <div class="barcode flex items-end h-6">
          <span style="height:100%"></span><span style="height:55%"></span><span style="height:80%"></span>
          <span style="height:40%"></span><span style="height:100%"></span><span style="height:65%"></span>
          <span style="height:50%"></span><span style="height:90%"></span><span style="height:60%"></span>
          <span style="height:100%"></span><span style="height:45%"></span><span style="height:75%"></span>
        </div>
        <p id="id-badge" class="font-mono text-[10px] tracking-[0.15em] text-[var(--ink-soft)] uppercase text-right leading-tight"></p>
      </div>
    </div>
  </div>

  <!-- Logika baca ?id= dan render data -->
  <script src="script.js"></script>
</body>
</html>
